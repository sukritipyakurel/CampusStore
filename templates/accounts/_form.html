<form method="post" class="stack narrow">
  {% csrf_token %}
  {% if form.non_field_errors %}<p class="error">{{ form.non_field_errors|join:" " }}</p>{% endif %}
  {% for field in form %}
    <div class="field{% if field.errors %} has-error{% endif %}">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<p class="error">{{ field.errors|join:" " }}</p>{% endif %}
    </div>
  {% endfor %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button class="btn">{{ submit }}</button>
</form>
